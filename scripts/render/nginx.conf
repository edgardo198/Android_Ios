worker_processes 1;
pid /run/nginx.pid;
# Upstream errors include full request URLs, including WebSocket credentials.
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # WebSocket URLs, reset links and media tickets can contain credentials.
    access_log off;
    sendfile on;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 10000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 105m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location ~ ^/(chat|calls|notifications|admin|ws)(/|$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Render terminates TLS; this listener is only used behind Render.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location = /health/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
        location ^~ /media/miniatura/ {
            # Django restores missing avatars from the bounded database archive.
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }
        location /media/ { return 404; }
        location /static/ {
            alias /app/staticfiles/;
            autoindex off;
        }
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Cache-Control no-store always;
            try_files $uri $uri/ /index.html;
        }
    }
}
